name: Setup Dart
description: >
  Dart SDK + pub deps for self-hosted ARC runners.
  Redirects PUB_CACHE to /home/runner/.cache/pub-cache so it lives in the
  host-mounted ~/.cache volume (provisioned by btc-runway).
  Runs dart pub get on every invocation — fast on warm download cache.

inputs:
  sdk:
    description: Dart SDK version
    required: false
    default: stable
  working-directory:
    description: Directory containing pubspec.lock
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ inputs.sdk }}

    - name: dart pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUB_CACHE: /home/runner/.cache/pub-cache
      run: |
        mkdir -p "$PUB_CACHE"
        echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
        dart pub get
