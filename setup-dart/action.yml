name: Setup Dart
description: >
  Dart SDK + cached pub dependencies for self-hosted ARC runners.
  Uses local filesystem cache — no network round-trip to GitHub's cache service.

inputs:
  sdk:
    description: Dart SDK version
    required: false
    default: stable
  working-directory:
    description: Directory containing pubspec.lock
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ inputs.sdk }}

    - uses: j3hempsey-actions/local-cache@9071640a145da48dc69fee95edf9f61901c1f54b
      id: cache
      with:
        path: ${{ inputs.working-directory }}/.dart_tool
        key: dart-deps-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}
      env:
        CACHE_DIR: /home/runner/.cache

    - name: dart pub get
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart pub get
