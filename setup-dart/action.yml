name: Setup Dart
description: >
  Dart SDK + pub deps for self-hosted ARC runners.
  Relies on host-mounted ~/.pub-cache download cache (provisioned by btc-runway).
  Runs dart pub get on every invocation — fast on warm download cache.

inputs:
  sdk:
    description: Dart SDK version
    required: false
    default: stable
  working-directory:
    description: Directory containing pubspec.lock
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      with:
        sdk: ${{ inputs.sdk }}

    - name: dart pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart pub get
