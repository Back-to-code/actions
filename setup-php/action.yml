name: Setup PHP
description: >
  PHP + Composer for self-hosted ARC runners.
  Switches PHP version via update-alternatives (versions pre-installed in runner image).
  Falls back to installing from ondrej/php PPA if the requested version is missing.
  Relies on host-mounted ~/.composer/cache download cache (provisioned by btc-runway).
  Runs composer install on every invocation — fast on warm download cache.

inputs:
  php-version:
    description: PHP version to use
    required: false
    default: '8.4'
  working-directory:
    description: Directory containing composer.json and composer.lock
    required: false
    default: '.'
  composer-flags:
    description: Extra flags for composer install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Select PHP ${{ inputs.php-version }}
      shell: bash
      run: |
        PHP_VERSION="${{ inputs.php-version }}"

        if [ ! -f "/usr/bin/php${PHP_VERSION}" ]; then
          echo "::warning::PHP ${PHP_VERSION} not pre-installed — installing from ondrej/php PPA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "php${PHP_VERSION}-cli" \
            "php${PHP_VERSION}-curl" \
            "php${PHP_VERSION}-mbstring" \
            "php${PHP_VERSION}-mysql" \
            "php${PHP_VERSION}-xml" \
            "php${PHP_VERSION}-zip"
        fi

        sudo update-alternatives --set php "/usr/bin/php${PHP_VERSION}"

    - name: composer install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XDEBUG_MODE: 'off'
      run: |
        composer install \
          --no-interaction \
          --no-progress \
          ${{ inputs.composer-flags }}
