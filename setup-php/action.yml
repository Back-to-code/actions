name: Setup PHP
description: >
  PHP + Composer + cached vendor for self-hosted ARC runners.
  Switches PHP version via update-alternatives (versions pre-installed in runner image).
  Uses local filesystem cache — no network round-trip to GitHub's cache service.

inputs:
  php-version:
    description: PHP version (must be pre-installed in runner image)
    required: false
    default: '8.4'
  working-directory:
    description: Directory containing composer.json and composer.lock
    required: false
    default: '.'
  composer-flags:
    description: Extra flags for composer install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Select PHP ${{ inputs.php-version }}
      shell: bash
      run: sudo update-alternatives --set php /usr/bin/php${{ inputs.php-version }}

    - uses: j3hempsey-actions/local-cache@9071640a145da48dc69fee95edf9f61901c1f54b
      id: cache
      with:
        path: ${{ inputs.working-directory }}/vendor
        key: composer-vendor-${{ hashFiles(format('{0}/composer.lock', inputs.working-directory)) }}
      env:
        CACHE_DIR: /home/runner/.cache

    - name: composer install
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XDEBUG_MODE: 'off'
      run: |
        composer install \
          --prefer-dist \
          --no-interaction \
          --no-progress \
          ${{ inputs.composer-flags }}
