name: Setup Node
description: >
  Node.js + cached node_modules for self-hosted ARC runners.
  Uses local filesystem cache — no network round-trip to GitHub's cache service.

inputs:
  node-version:
    description: Node.js version (must match runner image or tool-cache)
    required: false
    default: '22'
  working-directory:
    description: Directory containing package-lock.json
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - uses: j3hempsey-actions/local-cache@9071640a145da48dc69fee95edf9f61901c1f54b
      id: cache
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: node-modules-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
      env:
        CACHE_DIR: /home/runner/.cache

    - name: npm ci
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
