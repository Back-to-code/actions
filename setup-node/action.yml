name: Setup Node
description: >
  Node.js + npm for self-hosted ARC runners.
  Relies on host-mounted ~/.npm download cache (provisioned by btc-runway).
  Runs npm ci on every invocation — fast on warm download cache, always
  correct, postinstall scripts run every time.

inputs:
  node-version:
    description: Node.js version (must match runner image or tool-cache)
    required: false
    default: '22'
  working-directory:
    description: Directory containing package-lock.json
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
