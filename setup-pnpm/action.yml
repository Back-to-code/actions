name: Setup pnpm
description: >
  Node + pnpm, on self-hosted ARC runners or GitHub-hosted runners.
  pnpm comes from corepack (version from package.json "packageManager", or the
  pnpm-version input). On ARC the content-addressable store is a host-mounted
  volume (btc-runway pnpm-store, at pnpm's default path) — no cache action, the
  same arrangement setup-node has with ~/.npm; on GitHub-hosted it comes from
  actions/cache. Runs `pnpm install --frozen-lockfile --prefer-offline` on every
  invocation — fast on a warm store, always correct, install scripts run every time.

inputs:
  node-version:
    description: >
      Node.js version. On ARC this must match the runner image tool-cache — a value
      absent from it costs a download on every job; a major-only value like '24' resolves
      to the preinstalled build and costs nothing.
    required: false
    default: '24.16.0'
  pnpm-version:
    description: >
      pnpm version. Empty (default) takes it from package.json "packageManager" via
      corepack; set an explicit version (e.g. 9.12.0) for a repo without that field.
    required: false
    default: ''
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    # corepack ships with Node. With no pnpm-version, `enable` installs the pnpm
    # shim and the version resolves from package.json "packageManager" on first use.
    - name: Enable pnpm
      shell: bash
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        corepack enable
        if [ -n "$PNPM_VERSION" ]; then
          corepack prepare "pnpm@$PNPM_VERSION" --activate
        fi

    # ---------- GitHub-hosted only ----------
    # No host-mounted volume here, so the store comes from actions/cache. Self-hosted
    # skips this: the store is a btc-runway host volume at pnpm's default path, warm
    # across ephemeral pods — the same arrangement setup-node has with ~/.npm. It is
    # the STORE (immutable content-addressable packages), not node_modules — `pnpm
    # install` runs every job, so install scripts always execute and there is no partial
    # tree to go stale. Conditions are negated (`!= 'self-hosted'`) so an unrecognised
    # runner.environment still lands on a working setup.
    - if: runner.environment != 'self-hosted'
      id: store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - if: runner.environment != 'self-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ steps.store.outputs.dir }}
        key: pnpm-store-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: pnpm-store-

    # ---------- both ----------
    # --frozen-lockfile is the `npm ci` equivalent (fails on an out-of-date lockfile);
    # --prefer-offline skips registry metadata staleness checks when the store already
    # satisfies the lockfile — the pnpm analogue of setup-node's `npm ci --prefer-offline`.
    - name: pnpm install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile --prefer-offline
