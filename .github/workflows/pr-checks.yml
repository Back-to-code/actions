name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  runner-loss-retry-tests:
    name: runner-loss-retry tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test runner-loss-retry/test/*.test.js

  # The `on`/`on-gitflow` rulesets require a check named exactly `CI Passed`.
  #
  # List every job in `needs:` and keep `if: always()` — a job that is skipped
  # never reports, and a required check that never reports blocks the pull
  # request forever. Keep the job here rather than in a reusable workflow: a
  # called job reports as `<caller-job-id> / CI Passed`, which does not match
  # the required context.
  ci-passed:
    name: CI Passed
    if: always()
    needs: [runner-loss-retry-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | jq -r 'length > 0 and all(. == "success")')" = true
