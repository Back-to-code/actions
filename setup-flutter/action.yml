name: Setup Flutter
description: >
  Flutter SDK + pub deps for self-hosted ARC runners.
  Redirects PUB_CACHE to /home/runner/.cache/pub-cache so it lives in the
  host-mounted ~/.cache volume (provisioned by btc-runway).
  Runs flutter pub get on every invocation — fast on warm download cache.

inputs:
  flutter-version:
    description: Flutter version
    required: false
    default: stable
  channel:
    description: Flutter channel (stable, beta, master)
    required: false
    default: stable
  working-directory:
    description: Directory containing pubspec.lock
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: false

    - name: flutter pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUB_CACHE: /home/runner/.cache/pub-cache
      run: |
        mkdir -p "$PUB_CACHE"
        echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
        flutter pub get
