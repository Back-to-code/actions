name: Setup Flutter
description: >
  Flutter SDK + pub deps for self-hosted ARC runners.
  Relies on host-mounted ~/.pub-cache download cache (provisioned by btc-runway).
  Runs flutter pub get on every invocation — fast on warm download cache.

inputs:
  flutter-version:
    description: Flutter version
    required: false
    default: stable
  channel:
    description: Flutter channel (stable, beta, master)
    required: false
    default: stable
  working-directory:
    description: Directory containing pubspec.lock
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: false

    - name: flutter pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get
