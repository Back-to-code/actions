name: Setup Go
description: >
  Go + cached module downloads for self-hosted ARC runners.
  Disables built-in actions/setup-go cache (uses GitHub cloud).
  Uses local filesystem cache instead — no network round-trip.

inputs:
  go-version:
    description: Go version
    required: false
    default: '1.26'
  working-directory:
    description: Directory containing go.sum
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    # local-cache restores with `tar -C ~/go/pkg`; a fresh pod has no ~/go until
    # go mod download creates it, so a cache hit fails without this.
    - name: Create module cache dir
      shell: bash
      run: mkdir -p ~/go/pkg/mod

    - uses: j3hempsey-actions/local-cache@9071640a145da48dc69fee95edf9f61901c1f54b # v1.0.5
      id: cache
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
        # A truncated archive on the shared cache volume degrades to a re-download
        # instead of a red Gate; local-cache removes the bad file on the way.
        skip-failure: true
      env:
        CACHE_DIR: /home/runner/.cache

    # Always: a tolerated restore reports a hit with an empty module dir, and
    # on a real hit this is a no-op.
    - name: go mod download
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download
