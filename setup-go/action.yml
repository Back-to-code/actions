name: Setup Go
description: >
  Go + cached module downloads for self-hosted ARC runners.
  Disables built-in actions/setup-go cache (uses GitHub cloud).
  Uses local filesystem cache instead — no network round-trip.

inputs:
  go-version:
    description: Go version
    required: false
    default: '1.26'
  working-directory:
    description: Directory containing go.sum
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - uses: j3hempsey-actions/local-cache@9071640a145da48dc69fee95edf9f61901c1f54b
      id: cache
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
      env:
        CACHE_DIR: /home/runner/.cache

    - name: go mod download
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download
